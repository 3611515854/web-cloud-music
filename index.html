<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicPlayer</title>
    <link rel="stylesheet" href="./css/base.css">
</head>
<body>
    <!--整体布局容器-->
    <div class="app">
        <!--左侧导航栏-->
        <aside class="sidebar">
            <!--logo-->
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
                <span>Music</span>
            </div>
            <!--导航-->
            <nav class="nav">
                <div class="nav-top">
                    <button class="nav-item active">
                        <span>本地音乐</span>
                    </button>
                    <button class="nav-item">
                        <span>歌单</span>
                    </button>
                </div>
                <!--分割线-->
                <div class="nav-divider"></div>
                <!--歌单列表展示-->
                <div class="playlists-section">
                    <!--歌单列表头部-->
                    <div class="section-header">
                        <span>我的歌单</span>
                    </div>
                    <!--歌单列表-->
                    <div class="playlists-list"></div>
                </div>
            </nav>
            <!--设置按钮-->
            <div class="settings">
                <button class="setting-btn">
                    <span>设置</span>
                </button>
            </div>
        </aside>
        <!--右侧内容区-->
        <main class="main">
            <div class="content-header">
                <h1>本地音乐</h1>
                <button class="btn-primary" id="importBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
                    </svg>
                    导入音乐
                </button>
            </div>
            <div class="music-list" id="musicList">
                <div class="empty-state">
                    <p>暂无音乐</p>
                    <p class="hint">点击上方"导入音乐"添加本地文件</p>
                </div>
            </div>
        </main>
        <!--底部播放栏-->
        <div class="player-bar" id="playerBar">
            <div class="player-info">
                <!--歌曲封面-->
                <div class="player-cover" id="playerCover">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </div>
                <!--歌曲信息-->
                <div class="player-meta">
                    <div class="player-title" id="playerTitle">未播放</div>
                    <div class="player-artist" id="playerArtist">选择音乐进行播放</div>
                </div>
                <!--播放控制按钮-->
                <div class="player-controls">
                    <!--上一首-->
                    <button class="control-btn" id="prevBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <!--播放按钮-->
                    <button class="control-btn play-btn" id="playBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="play-icon">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="pause-icon" style="display:none">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    <!--下一首-->
                    <button class="control-btn" id="nextBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                </div>
                <!--播放进度条-->
                <div class="player-progress" id="playerProgress">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <!--播放进度-->
                <span class="time-info" id="timeInfo">00:00 / 00:00</span>
            </div>
        </div>
    </div>
</body>
</html>
